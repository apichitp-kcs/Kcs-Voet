# Builds the Windows app and publishes it as a GitHub Release.
# Installed copies (KCS-Vote-Setup) pick the new version up automatically.
#
# How to release:
#   1. bump "version" in desktop/package.json (e.g. 1.1.0 -> 1.1.1) and commit
#   2. git tag v1.1.1 && git push && git push origin v1.1.1
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload the .exe files

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check tag matches desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v$v"; exit 1
          fi

      - run: npm ci

      # Create the release first: otherwise the installer and the portable
      # target race and GitHub ends up with two "v1.x.y" releases.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes "KCS Vote ${GITHUB_REF_NAME#v}"

      - name: Build and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
