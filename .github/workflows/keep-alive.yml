# Backup keep-alive for the Supabase free project (layer 2; layer 1 is the
# Cloudflare cron Worker). Uses the public anon key only — never service_role.
# NOTE: GitHub disables scheduled workflows after 60 days without repository
# activity. Re-enable it in the Actions tab or push a commit occasionally.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 */2 * *"   # 03:00 UTC every 2nd day
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep_alive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are required"; exit 1
          fi
          auth=()
          # legacy anon keys are JWTs (eyJ...) and also go in Authorization
          case "$SUPABASE_ANON_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_ANON_KEY");; esac
          for attempt in 1 2; do
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive" \
              -H "apikey: $SUPABASE_ANON_KEY" "${auth[@]}" -H "Content-Type: application/json" \
              --data '{"source":"github"}' || echo 000)
            ok=$(jq -r '.ok // false' body.json 2>/dev/null || echo false)
            echo "attempt $attempt: HTTP $code ok=$ok"
            if [ "$code" = "200" ] && [ "$ok" = "true" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::keep_alive failed (HTTP $code): $(head -c 300 body.json 2>/dev/null)"
          exit 1
